  <!-- Audio Element (Replace MP3 link with your custom audio link) -->
  <audio id="audio-player" src="https://files.catbox.moe/nw21sk.mp3" loop></audio>

  <script>
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const progressFill = document.getElementById('progress-fill');
    const progressContainer = document.getElementById('progress-container');

    // Auto-play audio when user clicks anywhere on the page
    let autoPlayStarted = false;
    document.body.addEventListener('click', () => {
      if (!autoPlayStarted) {
        audio.play().then(() => {
          playBtn.textContent = '❚❚';
          autoPlayStarted = true;
        }).catch(err => console.log('Autoplay blocked:', err));
      }
    }, { once: true });

    // Play / Pause toggle button
    playBtn.addEventListener('click', (e) => {
      e.stopPropagation(); // Prevents triggering body click event twice
      if (audio.paused) {
        audio.play();
        playBtn.textContent = '❚❚';
      } else {
        audio.pause();
        playBtn.textContent = '▶';
      }
    });

    // Update Progress Bar
    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const progressPercent = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = `${progressPercent}%`;
      }
    });

    // Click on progress bar to skip
    progressContainer.addEventListener('click', (e) => {
      e.stopPropagation();
      const width = progressContainer.clientWidth;
      const clickX = e.offsetX;
      if (audio.duration) {
        audio.currentTime = (clickX / width) * audio.duration;
      }
    });

    // Persistent visitor counter using localStorage
    let count = localStorage.getItem('page_views') || 35;
    count = parseInt(count) + 1;
    localStorage.setItem('page_views', count);
    document.getElementById('views').textContent = count;
  </script>
